{% extends "base.html" %}
{% block title %}Cash{% endblock %}
{% block header_title %}Cash{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto space-y-4">

  {# Month filter: swaps only the list block. #}
  <form method="get" action="/cash" hx-get="/cash" hx-target="#cash-list" hx-swap="outerHTML"
        hx-trigger="change" class="flex gap-2">
    <input type="month" name="month" value="{{ month }}" aria-label="Month"
           class="flex-1 px-3 py-2 rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-900 text-sm" />
    <noscript><button type="submit" class="px-3 py-2 text-sm">Go</button></noscript>
  </form>

  {% include "cash/_list.html" %}
</div>
{% endblock %}
