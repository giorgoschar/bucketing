name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests alembic scripts
      - run: python -m pytest -o addopts="--strict-markers" -q

  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: expenses
          POSTGRES_PASSWORD: expenses
          POSTGRES_DB: expenses_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U expenses -d expenses_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://expenses:expenses@localhost:5432/expenses_test
      DATABASE_URL: postgresql://expenses:expenses@localhost:5432/expenses_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: >-
          python -m pytest -o addopts="--strict-markers" -q
          tests/test_db_backend.py tests/test_migrations.py
          tests/test_settlement*.py tests/test_household_settlement.py
          tests/test_scheduler.py
