name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests alembic scripts
      - run: ruff format --check app tests alembic scripts
      - run: python -m pytest -o addopts="--strict-markers" -q --cov=app --cov-report=term --cov-fail-under=80

  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: expenses
          POSTGRES_PASSWORD: expenses
          POSTGRES_DB: expenses_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U expenses -d expenses_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://expenses:expenses@localhost:5432/expenses_test
      DATABASE_URL: postgresql://expenses:expenses@localhost:5432/expenses_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      # Production runs Postgres 18: run the whole suite against it, not a subset.
      - run: python -m pytest -o addopts="--strict-markers" -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements*.txt }
      - run: python -m venv .venv && .venv/bin/pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
        working-directory: web
      - run: npm run gen:api && git diff --exit-code src/api/
        working-directory: web
      - run: npm run lint && npm run typecheck && npm test && npm run build
        working-directory: web
