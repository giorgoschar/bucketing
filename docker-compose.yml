services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: expenses_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdevpassword}
      POSTGRES_DB: expenses
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expenses_user -d expenses"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    # Local/VPS use: published on loopback only, put a reverse proxy in front.
    # Coolify ignores this and routes through Traefik labels instead.
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:8000:8000"
    volumes:
      # Bind mount, as in v1: existing receipts live in ./uploads on the host.
      # The container runs as uid 10001 — see docs/DEPLOY-COOLIFY.md for the
      # one-time `chown -R 10001 ./uploads`.
      - ./uploads:/app/uploads
      - backups:/backups
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://expenses_user:${POSTGRES_PASSWORD:-localdevpassword}@db:5432/expenses}
      - APP_SECRET_KEY=${APP_SECRET_KEY:?set APP_SECRET_KEY}
      - FIELD_ENCRYPTION_KEY=${FIELD_ENCRYPTION_KEY:-}
      - DEBUG=false
      - APP_BASE_URL=${APP_BASE_URL:?set APP_BASE_URL (public https URL, used in invite links)}
      - APP_NAME=Expenses
      - APP_TIMEZONE=${APP_TIMEZONE:-Europe/Athens}
      - TRUST_PROXY_HEADERS=true
      - ENABLE_SCHEDULER=true
      - RATE_LIMIT_STORAGE_URI=${RATE_LIMIT_STORAGE_URI:-}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - ALLOW_REGISTRATION=${ALLOW_REGISTRATION:-false}
      - BACKUP_BEFORE_MIGRATE=${BACKUP_BEFORE_MIGRATE:-true}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_CLAIMS_EMAIL=${VAPID_CLAIMS_EMAIL:-admin@localhost}
      - POSOKANEI_ENABLED=${POSOKANEI_ENABLED:-true}
      - POSOKANEI_BASE_URL=${POSOKANEI_BASE_URL:-https://api.posokanei.gov.gr}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  # Optional shared rate-limit store so limits hold across uvicorn workers.
  # Enable with `docker compose --profile redis up` and set
  # RATE_LIMIT_STORAGE_URI=redis://redis:6379 on the app.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    profiles: ["redis"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  # Daily pg_dump + uploads tarball into the `backups` volume. Runs from the
  # app image: its pg_dump (v17) can dump a 16 or 17 server, and the script is
  # baked in (no relative ./scripts bind that Coolify may not provide).
  # Drop this service when the database is a Coolify-managed Postgres with
  # Coolify's own scheduled backups enabled (see docs/DEPLOY-COOLIFY.md).
  backup:
    build: .
    restart: unless-stopped
    user: "10001"
    # Override the image entrypoint (which would run migrations + uvicorn).
    entrypoint: ["sh", "-c", "while true; do /app/scripts/backup.sh || echo 'BACKUP FAILED' >&2; sleep 86400; done"]
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://expenses_user:${POSTGRES_PASSWORD:-localdevpassword}@db:5432/expenses}
      - BACKUP_KEEP_DAYS=${BACKUP_KEEP_DAYS:-30}
    volumes:
      - ./uploads:/app/uploads:ro
      - backups:/backups
    depends_on:
      db:
        condition: service_healthy
    # Unhealthy when the newest database dump is older than ~26h, so a
    # silently failing backup shows up in Coolify / `docker compose ps`.
    healthcheck:
      test: ["CMD-SHELL", "find /backups -maxdepth 1 -name 'db-*.sql.gz' -mmin -1560 | grep -q ."]
      interval: 1h
      timeout: 10s
      start_period: 10m
      retries: 1

volumes:
  postgres_data:
  backups:
